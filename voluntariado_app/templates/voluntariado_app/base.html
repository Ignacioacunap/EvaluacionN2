{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Plataforma de Voluntariados{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'voluntariado_app/css/estilos.css' %}">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor">
            <span class="logo">🤝 Voluntariado&nbsp;Comunitario</span>
        </div>
    </header>

    <main class="contenedor contenido">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Programación Backend &middot; INACAP 2026 &middot; Evaluación 2</p>
        </div>
    </footer>
</body>
</html>
